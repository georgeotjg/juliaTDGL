..........aaaaa.abbbbbbbabbbbba.........
..........caaac.abbbbbbbaabbbac.........
............#...#abbbbba#caaac..........
.................#aabaa#...#............
..........bb..bb...bb..bb..bb...........
..........bb..bb...bb..bb..bb...........
..........bbb.bbb..bbb.bbb.bbb..........
..........bbb.bbb..bbb.bbb.bbb..........
..........bbb.bbb..bbb.bbb.bbb..........
..........bbb.bbb..bbb.bbb.bbb..........
..........bbbbbbbb.bbbbbbbbbbbb.........
..........bbbbbbbb.bbbbbbbbbbbb.........
..........bbbbbbbb.bbbbbbbbbbbb.........
.........bbbbbbbbbbbbbbbbbbbbbb.........
.........bbbbbbbbbbbbbbbbbbbbbbb........
.........bbbbbbbbbbbbbbbbbbbbbbb........
.........bbbbbbbbbbbbbbbbbbbbbbb........"""

[shape.palette]
