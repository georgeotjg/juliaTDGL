# Catalogue template: GEOM_MODE="SPHROW" written as pixels.
# Box 40x24x6, dx = 0.5. On that mesh it gives the catalogue mask to the bit;
# on another mesh the pixels are resampled to the nearest node.

[[shape]]
type = "pixels"
dx = 0.5
rows = """
........................................
........................................
........................................
........................................
........................................
....................#...................
.................abcccba................
................bcccccccb..#............
............#..acccccccccabbba..........
..........abbbabcccccccccbcccba.........
..........bbbbbcccccccccccccccb.........
.........#bbcbbcccccccccccccccb#........
..........bbbbbcccccccccccccccb.........
..........abbbabcccccccccbcccba.........
............#..acccccccccabbba..........
................bcccccccb..#............
.................abcccba................
....................#...................
........................................
........................................
........................................
........................................
........................................
........................................"""

[shape.palette]
"#" = { z = [1.5, 1.5], f = 0.0 }
"a" = { z = [1.0, 2.0], f = 0.0 }
"b" = { z = [0.5, 2.5], f = 0.0 }
"c" = { z = "all", f = 0.0 }
