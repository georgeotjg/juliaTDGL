# Example drawn with pixels. One pixel = one node at dx = 0.5 ξσ.
# First row = largest y (face y2); last row = face y1. Column 1 = x = 0.
# '#' goes through the whole thickness; 'b' only the lower half; '5' leaves f = 0.5.
[[shape]]
type = "pixels"
dx = 0.5
rows = """
........................................
........................................
........................................
................555555..................
................555555..................
........................................
........................................
........................................
........................................
........................................
........................................
........................................
........................................
........................................
........................................
........................................
........................................
........................................
...................bbbb.................
..................#bbbb.................
.................##bbbb.................
................###bbbb.................
...............####bbbb.................
..............#####bbbb................."""

[shape.palette]
"#" = { z = "all", f = 0.0 }
"b" = { z = "bottom", f = 0.0 }
"5" = { z = "all", f = 0.5 }
