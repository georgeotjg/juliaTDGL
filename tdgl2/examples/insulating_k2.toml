# The two-band notched box at kappa = 2 with an insulating buffer (sigma_vac = 0.01) outside the bar of the sample and its
# contacts: all of the current crosses the sample, as in a film in vacuum with leads at its ends.  The solve of the field
# is then iterative (about 3 times the cost of a metal buffer).  Short windows: a demonstration of the option.
#   OPENBLAS_NUM_THREADS=1 julia --project=tdgl2 tdgl2/scripts/run.jl tdgl2/examples/insulating_k2.toml
[material]
file = "mgb2_model_II.toml"
kappa = 2.0

[mesh]
nx = 40
ny = 24
nz = 6
dx = 0.5
buf = 2

[geometry]
GEOM_MODE = "WEDGE"

[scheme]
sigma_vac = 0.01

[protocol]
t_min_GL = 200.0
t_min_GL_res = 400.0

[run]
J = [0.40, 0.70]
H = 0.03
out_dir = "tdgl2/runs/insulating_k2"
