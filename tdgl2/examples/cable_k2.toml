# A cable along the current: the two-band model II at kappa = 2 in a disc of radius 2.75 ξσ (tdgl2/shapes/cable_x.toml), with
# vacuum around it and leads of the same section (a sculpted sample).  The vacuum needs the insulating padding (sigma_vac);
# J is the current density, so the cable carries J times its meshed section (26.75 ξσ² here).  Short windows: a
# demonstration of the option.
#   OPENBLAS_NUM_THREADS=1 julia --project=tdgl2 tdgl2/scripts/run.jl tdgl2/examples/cable_k2.toml
[material]
file = "mgb2_model_II.toml"
kappa = 2.0

[mesh]
nx = 40
ny = 12
nz = 12
dx = 0.5
buf = 2

[geometry]
GEOM_MODE = "CUSTOM"
geom_file = "cable_x.toml"

[scheme]
sigma_vac = 0.01

[protocol]
t_min_GL = 200.0
t_min_GL_res = 400.0

[run]
J = [0.40, 0.80]
H = 0.03
out_dir = "tdgl2/runs/cable_k2"
