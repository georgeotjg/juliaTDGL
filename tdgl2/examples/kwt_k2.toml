# The two-band notched box at kappa = 2 and H = 0.03 Hc2 with KWT in both bands (gamma_kwt = 10): the onset rises by the
# conversion partition (+17 % in this 20 xi box; +11 % in a 40 xi box, where the conversion layers take less of the
# sample: the delay law gives 0.694 against 0.625 without KWT).  The Stepper turns on the rotating frame and
# the RKL stage margin by itself with KWT.  About an hour on one core (52 min on an i5-1235U).
#   OPENBLAS_NUM_THREADS=1 julia --project=tdgl2 tdgl2/scripts/run.jl tdgl2/examples/kwt_k2.toml
# Expected: Ic+ in (0.73, 0.74], |Ic-| in (0.75, 0.76] (eta ~ -1.3 %); without KWT (gamma_kwt = 0) (0.62, 0.63] and
# (0.64, 0.65].  summary.json reports lambda_c = 2.39 xi and L/lambda_c = 8.4 in "regime".
[material]
name = "two-band notched-box model, kappa = 2, with KWT"
kappa = 2.0
sigma_n = 1.0
T = 0.0
gamma12 = 1e-3

[[material.band]]
name = "sigma"
m = 1.0
Gamma = 1.0
a = 1.0
gamma_kwt = 10.0

[[material.band]]
name = "pi"
xi_ratio = 4.0
Gamma = 1.0
a = 0.59
gamma_kwt = 10.0

[mesh]
nx = 40
ny = 24
nz = 6
dx = 0.5
buf = 1

[geometry]
GEOM_MODE = "WEDGE"

[scheme]
selffield_bc = "bar"

[protocol]
t_min_GL = 400.0
t_min_GL_res = 1584.0
t_confirm_GL = 3000.0     # the onset by the delay: the silent rungs below the first flowing one are followed this long
stop_after_V = 1

[run]
J = [0.30, 0.50, 0.60, 0.66, 0.70, 0.72, 0.73, 0.74, 0.75, 0.76, 0.77]
H = 0.03
out_dir = "tdgl2/runs/kwt_k2"
