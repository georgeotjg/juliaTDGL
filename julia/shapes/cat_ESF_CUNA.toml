....................#...................
.................abcccba................
................bcccccccb...............
...............accccccccca..............
...............bcccccccccb..............
...............ccccccccccc..............
..............#ccccccccccc#.............
...............ccccccccccc..............
...............bcccccccccb..............
...............accccccccca..............
................bcccccccb...............
.................abcccba................
....................#...................
........................................
..........................ccc...........
..........................cccc..........
..........................cccc..........
.........................cccccc.........
.........................ccccccc........"""

[shape.palette]
"#" = { z = [1.5, 1.5], f = 0.0 }
"a" = { z = [1.0, 2.0], f = 0.0 }
"b" = { z = [0.5, 2.5], f = 0.0 }
"c" = { z = "all", f = 0.0 }
