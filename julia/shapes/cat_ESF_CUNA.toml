# Catalogue template: GEOM_MODE="ESF_CUNA" written as pixels.
# Box 40x24x6, dx = 0.5. On that mesh it gives the catalogue mask to the bit;
# on another mesh the pixels are resampled to the nearest node.

[[shape]]
type = "pixels"
dx = 0.5
rows = """
